<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04050d">
  <title>Genopoisk — подбор сервера…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #04050d;
      color: #e8eaf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 320px; width: 100%; }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
    }
    .logo .film { margin-right: 10px; }
    .spinner {
      width: 42px; height: 42px;
      margin: 0 auto 22px;
      border: 3px solid rgba(232, 234, 242, 0.15);
      border-top-color: #e8eaf2;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { font-size: 15px; line-height: 1.5; color: #9aa0b4; min-height: 44px; }
    #hosts { margin-top: 18px; font-size: 13px; color: #5c6172; line-height: 1.9; }
    #hosts a { color: #8ab4ff; text-decoration: none; }
    #hosts a:hover { text-decoration: underline; }
    #retry {
      display: none;
      margin: 20px auto 0;
      padding: 12px 34px;
      font-size: 15px;
      font-weight: 600;
      color: #04050d;
      background: #e8eaf2;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #retry:active { transform: scale(0.97); }
    .err .spinner { display: none; }
    .err #retry { display: block; }
    noscript div {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.8;
      color: #9aa0b4;
    }
    noscript a { color: #8ab4ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span class="film">🎬</span>Genopoisk</div>
    <div class="spinner" id="spin"></div>
    <div id="status">Подбираем доступный сервер…</div>
    <div id="hosts" hidden>
      <a href="https://genopoisk.duckdns.org/">genopoisk.duckdns.org</a><br>
      <a href="https://genopoisk.vercel.app/">genopoisk.vercel.app</a>
    </div>
    <button id="retry" type="button">Повторить</button>
    <noscript>
      <div>
        Для автоматического выбора сервера нужен JavaScript.<br>
        Откройте напрямую:
        <a href="https://genopoisk.duckdns.org/">genopoisk.duckdns.org</a> или
        <a href="https://genopoisk.vercel.app/">genopoisk.vercel.app</a>
      </div>
    </noscript>
  </div>
  <script>
  // GH Pages router for Genopoisk (v188).
  //
  // WHY: *.vercel.app lives on a rotating anycast IP pool that RU TSPU blocks
  // per-ISP (IP lottery — some projects open, some don't, changes every DNS
  // roll). A custom domain (genopoisk.duckdns.org -> A 76.76.21.21) is served
  // from a different Vercel IP set that is currently clean from RU. GitHub
  // Pages (185.199.x) is reachable from RU on every node we tested.
  //
  // This page is the always-reachable ENTRY: probe the known hosts in the
  // browser (the only vantage point that matters — the user's own network),
  // then hand off to the first live one, preserving the app path (?to=),
  // query and the Telegram webview hash (#tgWebAppData=...).
  //
  // v188 — TWO ROUTING PROFILES:
  //   * Mini App launches (hash carries tgWebAppData): vercel.app FIRST.
  //     The Mini App is used through Telegram, which in RU needs a VPN —
  //     and through a VPN vercel.app is always reachable. duckdns stays as
  //     the fallback for non-VPN webview users.
  //   * Plain browsers: duckdns FIRST (clean from RU, no VPN needed),
  //     vercel.app as fallback. Same as before.
  (function () {
    'use strict';

    var WEBVIEW_HOSTS = [
      'https://genopoisk.vercel.app',
      'https://genopoisk.duckdns.org'
    ];
    var BROWSER_HOSTS = [
      'https://genopoisk.duckdns.org',
      'https://genopoisk.vercel.app'
    ];
    var LS_KEY = 'gp_router_pref';
    var PROBE = '/api/version';
    var PROBE_TIMEOUT = 4000;
    var AUTO_ROUNDS = 3;

    var statusEl = document.getElementById('status');
    var hostsEl = document.getElementById('hosts');
    var retryEl = document.getElementById('retry');
    var bodyEl = document.body;

    function say(msg) { try { statusEl.textContent = msg; } catch (e) {} }

    // Target app path from ?to= (percent-encoded path+query of the app page).
    // Strict sanitizing: only same-origin absolute paths, no protocol-relative
    // '//host', no backslashes — this page redirects, it must not be an
    // open redirector.
    function targetPath() {
      var raw = null;
      try { raw = new URLSearchParams(window.location.search).get('to'); } catch (e) {}
      if (!raw) return '/';
      raw = String(raw);
      if (raw.charAt(0) !== '/') return '/';          // 'https://evil..' rejected
      if (raw.charAt(1) === '/') return '/';          // '//evil..' rejected
      if (raw.indexOf('\\') !== -1) return '/';       // '/\' tricks rejected
      if (raw.indexOf('#') !== -1) raw = raw.split('#')[0]; // hash comes from us
      return raw || '/';
    }

    // Telegram webview appends its payload as the URL hash (#tgWebAppData=…).
    // It MUST survive the handoff or the Mini App loses auth. It ALSO tells
    // us this is a Mini App launch → route to vercel.app (see header).
    function targetHash() { return window.location.hash || ''; }
    function isWebview() { return window.location.hash.indexOf('tgWebAppData') !== -1; }

    function hostsForThisLaunch() {
      if (isWebview()) return WEBVIEW_HOSTS.slice(); // deterministic: vercel first, no pref juggling
      return orderedHosts(BROWSER_HOSTS);
    }

    function probe(host) {
      return new Promise(function (resolve) {
        var done = false;
        var ctl = ('AbortController' in window) ? new AbortController() : null;
        function finish(v) { if (done) return; done = true; clearTimeout(timer); resolve(v); }
        var timer = setTimeout(function () { ctl && ctl.abort(); finish(null); }, PROBE_TIMEOUT);
        // redirect:'manual' — честная семантика: победить может только хост,
        // который ОТВЧАЕТ сам (307/opaqueredirect → not ok → следующая
        // попытка). С v188 оба хоста отвечают сами — проба различает живой
        // деплой от упавшего.
        fetch(host + PROBE, { cache: 'no-store', mode: 'cors', redirect: 'manual', signal: ctl ? ctl.signal : undefined })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { finish(j && j.service === 'genopoisk' ? host : null); })
          .catch(function () { finish(null); });
      });
    }

    function orderedHosts(base) {
      var list = base.slice();
      try {
        var pref = localStorage.getItem(LS_KEY);
        if (pref && list.indexOf(pref) > 0) {
          list = [pref].concat(list.filter(function (h) { return h !== pref; }));
        }
      } catch (e) { /* private mode etc. */ }
      return list;
    }

    var round = 0;
    function run() {
      round = 0;
      bodyEl.classList.remove('err');
      hostsEl.hidden = true;
      say('Подбираем доступный сервер…');
      nextRound();
    }

    function nextRound() {
      round++;
      var list = hostsForThisLaunch();
      var i = 0;
      function next() {
        if (i >= list.length) {
          if (round < AUTO_ROUNDS) {
            say('Сервер пока недоступен — пробуем ещё раз…');
            setTimeout(nextRound, 2500);
          } else {
            giveUp();
          }
          return;
        }
        var host = list[i++];
        say('Проверяем ' + host.replace('https://', '') + '…');
        probe(host).then(function (winner) {
          if (winner) {
            try { localStorage.setItem(LS_KEY, winner); } catch (e) {}
            say('Готово, открываем…');
            window.location.replace(winner + targetPath() + targetHash());
          } else {
            next();
          }
        });
      }
      next();
    }

    function giveUp() {
      say('Сейчас ни один сервер не отвечает из вашей сети. ' +
          'Возможно, провайдер временно блокирует доступ — попробуйте ещё раз через минуту.');
      hostsEl.hidden = false;
      bodyEl.classList.add('err');
    }

    retryEl.addEventListener('click', run);

    run();
  })();
  </script>
</body>
</html>
