<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, minimum-scale=1">
  <meta name="theme-color" content="#08080d">
  <title>Нет соединения — Filmotiv</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: #08080d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow-x: hidden;
    }
    /* ADHD OS living background */
    .background { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .28; animation: adhdFloatOrb 12s ease-in-out infinite alternate; }
    .orb.one { width: 260px; height: 260px; background: #8b5cf6; top: -100px; left: -80px; }
    .orb.two { width: 220px; height: 220px; background: #ec4899; right: -80px; top: 30%; animation-delay: -4s; }
    .orb.three { width: 280px; height: 280px; background: #38bdf8; bottom: -140px; left: 20%; animation-delay: -7s; }
    @keyframes adhdFloatOrb {
      from { transform: translate(0,0) scale(1); }
      to { transform: translate(40px,-30px) scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
    .container { position: relative; z-index: 1; max-width: 340px; width: 100%;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      padding: 30px 22px;
      box-shadow: 0 12px 50px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .eyebrow { color: #92929f; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
    .icon {
      font-size: 72px;
      margin-bottom: 16px;
      opacity: 0.9;
      display: block;
    }
    h1 {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #92929f;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,.16);
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
      box-shadow: 0 12px 35px rgba(139,92,246,.28);
    }
    .btn:active { transform: scale(0.96); }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #777783;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>
  <div class="container">
    <div class="eyebrow">📡 Offline Mode</div>
    <div class="icon">📡</div>
    <h1>Нет соединения</h1>
    <p>Проверьте подключение к интернету и попробуйте снова. Фильмы требуют подключения для воспроизведения.</p>
    <button class="btn" onclick="location.reload()">ПОВТОРИТЬ</button>
    <div class="footer">Filmotiv</div>
  </div>
</body>
</html>
