<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Genopoisk — вход переехал на /gp/…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #04050d; color: #e8eaf2; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .logo { font-size: 26px; font-weight: 700; margin-bottom: 14px; }
    p { color: #9aa0b4; font-size: 14px; line-height: 1.7; }
    a { color: #8ab4ff; }
  </style>
</head>
<body>
  <div>
    <div class="logo"><span>🎬</span> Genopoisk</div>
    <p>Вход переехал: <a href="/gp/">genocide12.github.io/gp/</a><br>Переводим…</p>
    <noscript><p>Откройте вручную: <a href="/gp/">genocide12.github.io/gp/</a></p></noscript>
  </div>
  <script>
    // Мгновенный переезд на новый путь. Сохраняем ?to= и Telegram-хеш
    // (#tgWebAppData=…) — старые ссылки и кнопка бота продолжат работать.
    (function () {
      'use strict';
      window.location.replace('/gp/' + (window.location.search || '') + (window.location.hash || ''));
    })();
  </script>
</body>
</html>
