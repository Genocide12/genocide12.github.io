<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1924"><title>Котофон Геныча</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1924;color:#fff;font:17px -apple-system,system-ui,sans-serif;padding:30px 18px;text-align:center}main{max-width:500px;margin:auto}h1{font-size:30px}button{display:block;width:100%;border:0;border-radius:17px;background:#20b7a5;color:#041b1c;padding:19px;margin:15px 0;font-size:19px;font-weight:700}button:disabled{opacity:.5}.secondary{background:#273e4c;color:white}#status{min-height:60px;color:#d0e6ed;line-height:1.5}audio{width:100%;margin:16px 0}small{color:#a5b9c3}#timer{font-size:52px;font-weight:800;margin:12px}</style></head><body><main><h1>🐈 Котофон Геныча</h1><p>Твой голос зовёт Геныча</p><button id="record">🎙 Записать команду</button><button id="stop" class="secondary" disabled>■ Завершить запись</button><button id="play" disabled>🔊 Позвать Геныча</button><audio id="audio" controls></audio><div id="timer">10</div><button id="wait" class="secondary">⏱ Запустить ожидание</button><p id="status">Нажми «Записать команду» и разреши доступ к микрофону.</p><small>Запись хранится только в этом браузере. Не удаляй данные Safari, если хочешь её сохранить. Для первой записи нужен доступ к микрофону.</small></main><script>
const $=id=>document.getElementById(id);let recorder,chunks=[],url=null,timer=null,seconds=10;
function status(s){$('status').textContent=s}function setAudio(blob){if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('audio').src=url;$('play').disabled=false;status('Запись готова. Нажми «Позвать Геныча».')}
$('record').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Микрофон недоступен в этом браузере');const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{setAudio(new Blob(chunks,{type:recorder.mimeType||'audio/mp4'}));stream.getTracks().forEach(t=>t.stop())};recorder.start();$('record').disabled=true;$('stop').disabled=false;status('Идёт запись. Скажи: «Геныч, иди сюда! Кис-кис-кис!»')}catch(e){status('Не удалось записать: '+e.message)}};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop();$('record').disabled=false;$('stop').disabled=true};
$('play').onclick=async()=>{try{$('audio').currentTime=0;await $('audio').play();status('Проигрывается твой голос')}catch(e){status('Ошибка воспроизведения: '+e.message)}};
$('wait').onclick=()=>{clearInterval(timer);seconds=10;$('timer').textContent=seconds;status('Ждём реакции Геныча');timer=setInterval(()=>{seconds--;$('timer').textContent=seconds;if(seconds<=0){clearInterval(timer);status('Время вышло. Если Геныч подошёл — похвали его!')}},1000)};
</script></body></html>
