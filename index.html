<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genocide12 — проекты</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎞️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #04050d; color: #e8eaf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .wrap { max-width: 720px; width: 100%; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: .4px; text-align: center; }
    .sub { color: #5c6172; font-size: 14px; text-align: center; margin: 8px 0 36px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: rgba(232,234,242,.04); border: 1px solid rgba(232,234,242,.09);
      border-radius: 16px; padding: 26px 24px; transition: .18s;
    }
    a.card:hover { background: rgba(232,234,242,.08); border-color: rgba(139,92,246,.5); transform: translateY(-2px); }
    .card .ico { font-size: 30px; margin-bottom: 12px; }
    .card b { font-size: 19px; display: block; margin-bottom: 6px; }
    .card span { color: #9aa0b4; font-size: 13.5px; line-height: 1.55; display: block; }
    .card .go { margin-top: 14px; color: #8b5cf6; font-size: 13px; font-weight: 600; }
    .foot { margin-top: 30px; text-align: center; color: #5c6172; font-size: 12.5px; line-height: 1.9; }
    .foot a { color: #8ab4ff; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Genocide12 — проекты</h1>
    <p class="sub">Два независимых кино-сервиса</p>
    <div class="cards">
      <a class="card" href="/gp/">
        <div class="ico">🎬</div>
        <b>Genopoisk</b>
        <span>Вход в приложение: подбор доступного сервера и переход.</span>
        <span class="go">Открыть →</span>
      </a>
      <a class="card" href="/fm/">
        <div class="ico">🎥</div>
        <b>Filmotiv</b>
        <span>Зеркало сайта: каталог, поиск, просмотр.</span>
        <span class="go">Открыть →</span>
      </a>
    </div>
    <p class="foot">
      Прямые адреса (стабильны в РФ без VPN):<br>
      <a href="https://genopoisk.duckdns.org/">genopoisk.duckdns.org</a> ·
      <a href="https://filmotiv.duckdns.org/">filmotiv.duckdns.org</a>
    </p>
  </div>
  <script>
    // Санитайзер: у возвращающихся посетителей мог остаться Service Worker
    // эпохи, когда зеркало Filmotiv жило в корне. Чистим все регистрации и кеши.
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister().catch(function () {}); });
          }).catch(function () {});
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k).catch(function () {}); });
          }).catch(function () {});
        }
      } catch (e) { /* no-op */ }
    })();
  </script>
</body>
</html>
