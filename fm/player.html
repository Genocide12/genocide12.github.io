<html lang="ru">

       cdn.vercel-insights.com/v1/script.js → ERR_BLOCKED_BY_CLIENT в консоли -->
  <title>Плеер</title>
  <script>
    // ====== Performance & error logging ======
    console.log('[perf] player.html started at', (performance.now() / 1000).toFixed(2) + 's');
    window.addEventListener('DOMContentLoaded', function() {
      console.log('[perf] DOMContentLoaded at', (performance.now() / 1000).toFixed(2) + 's');
    });
    window.addEventListener('load', function() {
      console.log('[perf] Window load at', (performance.now() / 1000).toFixed(2) + 's');
    });
    window.addEventListener('error', function(e) {
      console.error('[error]', e.message, e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[unhandled rejection]', e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>
  <script>
    // ALWAYS attempt to load telegram-web-app.js — but only AFTER the window
    // load event (see index.html for the full rationale: UA-gating broke Mini
    // App detection, while inserting the script during page load delayed the
    // window load event by up to ~20s when telegram.org is unreachable).
    // On this page the script provides initData for /api/me and /api/track
    // (premium / favorites sync inside the Mini App).
    (function() {
      function insertTgScript() {
        if (window.Telegram && window.Telegram.WebApp) return; // already injected
        var loaded = false;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.onload = function() {
          loaded = true;
          try { document.dispatchEvent(new CustomEvent('tg-webapp-loaded')); } catch (_) {}
        };
        s.onerror = function() { console.log('[tg] telegram-web-app.js unavailable'); };
        document.head.appendChild(s);
        setTimeout(function() {
          if (!loaded && s.parentNode) {
            s.parentNode.removeChild(s);
            console.log('[tg] telegram-web-app.js load aborted (timeout)');
          }
        }, 4000);
      }
      if (document.readyState === 'complete') insertTgScript();
      else window.addEventListener('load', insertTgScript, { once: true });
    })();
  </script>
  <style>
    html, body {
      margin:0;
      padding:0;
      background:#08080d;

      right:0;

      align-items:center;
      justify-content:space-between;
      color:#fff;
      background:rgba(13,13,22,0.78);backdrop-filter:blur(25px) saturate(160%);-webkit-backdrop-filter:blur(25px) saturate(160%);border-bottom:1px solid rgba(255,255,255,0.10);

    .btn:active { background:rgba(139,92,246,0.30); transform: scale(0.96); }
    .btn-close { background:rgba(251,113,133,0.18); border-color:rgba(251,113,133,0.30); color:#fb7185; margin-left:4px; }
    .btn-close:active { background:rgba(251,113,133,0.45); transform: scale(0.96); }
    .btn-src { background:rgba(139,92,246,0.16); border-color:rgba(139,92,246,0.32); color:#a78bfa; font-size:16px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; padding:0; }
    .btn-src:active { background:rgba(139,92,246,0.42); transform: scale(0.94); }
    .btn-fav { background:rgba(236,72,153,0.16); border-color:rgba(236,72,153,0.30); color:#ec4899; font-size:20px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s; box-shadow:0 0 16px rgba(236,72,153,0.18); }
    .btn-fav.active { background:rgba(255,45,85,0.45); color:#fff; }
    .btn-fav:active { transform: scale(0.92); }
    .btn-fav.pop { animation: btnFavPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-fav.unpop { animation: btnFavUnpop 0.35s ease-out; }
    @keyframes btnFavPop { 0%{transform:scale(1);} 40%{transform:scale(1.35);} 70%{transform:scale(0.95);} 100%{transform:scale(1);} }
    @keyframes btnFavUnpop { 0%{transform:scale(1);} 40%{transform:scale(0.85);opacity:0.6;} 100%{transform:scale(1);opacity:1;} }
    .fav-burst { position:absolute; pointer-events:none; font-size:16px; animation: favBurstUp 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; z-index:999; opacity:0; }
    @keyframes favBurstUp { 0%{transform:translateY(0) scale(0.6);opacity:0;} 20%{transform:translateY(-8px) scale(1.2);opacity:1;} 100%{transform:translateY(-50px) scale(0.8);opacity:0;} }

    /* ====== Ошибка загрузки фильма (404 embess / троттлинг) ====== */

    .pe-card {
      text-align:center; max-width:340px; width:calc(100% - 40px);

      border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:30px 24px;

<body>
  <div class="player-header" id="playerHeader">
    <span class="title" id="videoTitle">Загрузка...</span>
    <div class="btn-group">
      <button class="btn btn-fav" id="favBtn" title="В избранное">❤</button>

    </div>
  </div>
  <div class="player-main" id="playerMain">
    <iframe id="playerIframe" class="player-iframe" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="origin"></iframe>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">
        <div class="loading-title" id="loadingTitle"></div>
        <div class="loading-subtitle" id="loadingSubtitle"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <!-- v192: прозрачная подсказка по центру плеера; pointer-events:none —
         клики проходят насквозь; показывается после загрузки страницы -->
    <div class="play-hint" id="playHint">Нажмите play и значок</div>
    <!-- Rate film overlay — appears when film ends -->
    <div class="rate-overlay" id="rateOverlay">
      <div class="rate-card">
        <div class="rate-emoji">🎬</div>
        <div class="rate-title" id="rateTitle"></div>
        <div class="rate-film-name" id="rateFilmName"></div>
        <div class="rate-stars" id="rateStars">
          <button class="rate-star" data-rating="1">☆</button>
          <button class="rate-star" data-rating="2">☆</button>
          <button class="rate-star" data-rating="3">☆</button>

      </div>
    </div>
    <!-- Ошибка загрузки фильма (нет в источнике / троттлинг embess) -->
    <div class="player-error" id="playerError">
      <div class="pe-card">
        <div class="pe-emoji">🎬</div>
        <div class="pe-title" id="peTitle">Фильм недоступен в плеере</div>
        <div class="pe-sub" id="peSub">Источник не вернул видео. Уже пробуем другие зеркала автоматически — обычно помогает за пару минут.</div>
        <div class="pe-btns">
          <button class="pe-btn pe-primary" id="peRetry">⟳ Ещё раз</button>
          <button class="pe-btn" id="peClose">✕ Закрыть</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // ====== Phase 1: Bind close button IMMEDIATELY ======
    (function bindCloseButtonEarly() {
      var btn = document.getElementById('closeBtn');
      if (!btn) return;
      function goHome(ev) {
        try { if (ev && ev.cancelable) { ev.preventDefault(); ev.stopPropagation(); } } catch (_) {}
        // КРЕСТИК ВСЕГДА закрывает плеер и возвращает на главную:
        // не history.back (плеер мог открыться напрямую/из Telegram),
        // а явный переход на корень текущего origin.
        var home = 'index.html';
        try { window.location.replace(home); } catch (e) {
          try { window.location.href = home; } catch (_) {}
        }
      }
      btn.addEventListener('click', goHome);
      btn.addEventListener('touchend', function(e) { goHome(e); }, { passive: false });
    })();

    // ====== Phase 2: Player logic ======
    // Note: removed contextmenu/copy/cut/selectstart blockers — they were
    // blocking venoplayer's touch handlers and preventing controls from
    // appearing on tap.

    var params = new URLSearchParams(window.location.search);
    var kid = params.get('id') || '4910542';
    var title = params.get('title') || 'Фильм';
    // Read &t= parameter for resume playback (venoplayer natively supports it)
    var startTime = params.get('t') || '0';
    if (startTime && parseInt(startTime, 10) > 0) {
      console.log('[player] Resume from t=' + startTime + 's');
    }
    document.getElementById('videoTitle').textContent = title;
    var iframe = document.getElementById('playerIframe');
    var playerMain = document.getElementById('playerMain');
    var toastEl = document.getElementById('toast');
    var loadingOverlay = document.getElementById('loadingOverlay');
    var loadingTitle = document.getElementById('loadingTitle');
    var loadingSubtitle = document.getElementById('loadingSubtitle');

    // Show film title + resume position in the loading overlay (preloader)
    if (loadingTitle) loadingTitle.textContent = title;
    if (loadingSubtitle) {
      var startSec = parseInt(startTime, 10) || 0;
      if (startSec > 5) {
        loadingSubtitle.textContent = (typeof t === 'function' ? t('playerResume') : 'Продолжить с') + ' ' + formatTime(startSec);
      } else {
        loadingSubtitle.textContent = typeof t === 'function' ? t('playerLoading') : 'Загрузка плеера...';
      }
    }

    var tg = window.Telegram && window.Telegram.WebApp;
    function tryInitTg() {
      tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return false;
      try {
        // Call ready() FIRST so Telegram knows we're ready to receive events,
        // then expand() to take full viewport. Without ready(), expand() may
        // be ignored on some clients.
        if (tg.ready) tg.ready();
        if (tg.expand) tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        if (tg.BackButton && tg.BackButton.hide) tg.BackButton.hide();
        // Enable vertical swipes for fullscreen control in Mini App
        if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
      } catch(_) {}
      return true;
    }
    tryInitTg();
    window.addEventListener('load', function() { if (!tg) tryInitTg(); });
    // telegram-web-app.js loads async and may appear at ANY moment (the
    // window load event does not wait for dynamically-inserted scripts).
    // Listen for the loader event and keep retrying for 6s as a safety net.
    document.addEventListener('tg-webapp-loaded', function() { if (!tg) tryInitTg(); });
    var tgRetry = setInterval(function() {
      if (tg || tryInitTg()) clearInterval(tgRetry);
    }, 300);
    setTimeout(function() { clearInterval(tgRetry); }, 6000);

    // getUserId — prefers Telegram ID (set after OIDC login or in Mini App),
    // falls back to a temp web_* ID for unauthorised browser sessions.
    // This MUST match the logic in index.html so player and site use the
    // same identifier — otherwise cross-device resume breaks.
    function getUserId() {
      var tgId = localStorage.getItem('filmotiv_tg_user_id');
      if (tgId) return tgId;
      var id = localStorage.getItem('filmotiv_user_id');
      if (!id) {
        var rand = Math.random().toString(36).slice(2, 11);
        var time = Date.now().toString(36);
        id = 'web_' + time + '_' + rand;
        localStorage.setItem('filmotiv_user_id', id);
      }
      return id;
    }
    var browserUserId = getUserId();
    // tgInitData is dynamic — telegram-web-app.js loads async, so we
    // re-read it every time instead of caching at page load.
    function getTgInitData() {
      try {
        var t = window.Telegram && window.Telegram.WebApp;
        return (t && t.initData) ? t.initData : '';
      } catch(_) { return ''; }
    }

    var toastTimer = null;
    function showToast(msg, ms) {
      ms = ms || 2500;
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toastEl.style.display = 'none'; }, ms);
    }

    function trackEvent(type, payload) {
      payload = payload || {};
      // Re-read userId (in case login completed after page load)
      var body = { type: type, initData: getTgInitData(), userId: getUserId() };
      Object.keys(payload).forEach(function(k) { body[k] = payload[k]; });
      try {
        var tOpts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(body) };
        (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.apiFetch('/api/track', tOpts) : fetch('/api/track', tOpts)).catch(function() {});
      } catch (e) {}
    }
    trackEvent('page_views', { path: '/player' });

    // Send position to backend for cross-device resume. Uses keepalive so it
    // works even when called from pagehide / beforeunload.
    function sendPositionToBackend(seconds, duration) {
      if (!seconds || seconds < 5 || !isFinite(seconds)) return;
      // Re-read userId (in case login completed after page load)
      var uid = getUserId();
      // Don't send if userId is a guest web_* ID — server would skip it anyway
      if (String(uid).indexOf('web_') === 0) return;
      var payload = JSON.stringify({
        type: 'position_update',
        initData: getTgInitData(),
        userId: uid,
        username: localStorage.getItem('filmotiv_tg_username') || '',
        filmId: kid,
        title: title,
        position: Math.floor(seconds),
        duration: Math.floor(duration || 0)
      });
      try {
        var pOpts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: payload, keepalive: true };
        (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.apiFetch('/api/track', pOpts, 5000) : fetch('/api/track', pOpts)).catch(function() {});
      } catch (e) {}
    }

    function positionKey(filmId) { return 'filmotiv_position_' + filmId; }

    function savePosition(seconds, duration) {
      if (!seconds || seconds < 5 || !isFinite(seconds)) return;
      try {
        localStorage.setItem(positionKey(kid), JSON.stringify({
          t: seconds, d: duration || 0, ts: new Date().toISOString(), title: title
        }));
      } catch (_) {}
    }

    function loadPosition() {
      try {
        var raw = localStorage.getItem(positionKey(kid));
        if (!raw) return null;
        var data = JSON.parse(raw);
        if (!data || !data.t || data.t < 5) return null;
        var age = Date.now() - new Date(data.ts).getTime();
        if (age > 30 * 24 * 60 * 60 * 1000) return null;
        if (data.d && data.t > data.d - 5) return null;
        return data;
      } catch (_) { return null; }
    }

    function clearPosition() {
      try { localStorage.removeItem(positionKey(kid)); } catch (_) {}
    }

    function formatTime(s) {
      if (!s || s < 0 || !isFinite(s)) s = 0;
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = Math.floor(s % 60);
      function pad(n) { return n < 10 ? '0' + n : '' + n; }
      return h > 0 ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
    }

    // Choose the best resume position:
    //   1. ?t= URL param (set by index.html resume card from server data)
    //   2. localStorage position (from previous session on THIS device)
    // Server-provided ?t= wins because it may be more recent (saved from
    // another device a few seconds ago).
    var urlStartSec = parseInt(startTime, 10) || 0;
    var savedPos = null;
    if (urlStartSec > 5) {
      savedPos = { t: urlStartSec, d: 0, ts: new Date().toISOString(), title: title, fromUrl: true };
      console.log('[player] Using ?t=' + urlStartSec + ' from URL (cross-device resume)');
    } else {
      savedPos = loadPosition();
      if (savedPos) console.log('[player] Using localStorage position:', savedPos.t);
    }
    var playerReady = false;
    var playerReadyTime = 0; // timestamp when player became ready (for ended-event validation)
    var lastKnownTime = 0;
    var lastKnownDuration = 0;
    var lastSaveTime = 0;
    var lastBackendSaveTime = 0;
    var seekRetries = 0;
    var isResuming = false; // true while we're seeking to saved position
    var isFavorite = false; // current favorite state, loaded from backend

    function sendToPlayer(msg) {
      try {
        iframe.contentWindow.postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg), '*');
      } catch (_) {}
    }

    // ====== Favorite button (❤ = Коллекция) ======
    var favBtn = document.getElementById('favBtn');
    function updateFavBtn() {
      if (!favBtn) return;
      favBtn.textContent = isFavorite ? '❤' : '♡';
      favBtn.classList.toggle('active', isFavorite);
      favBtn.title = isFavorite ? 'Убрать из коллекции' : 'В коллекцию';
    }

    function showFavBurst() {
      if (!favBtn) return;
      var rect = favBtn.getBoundingClientRect();
      var count = 5;
      for (var i = 0; i < count; i++) {
        var burst = document.createElement('div');
        burst.className = 'fav-burst';
        burst.textContent = '❤';
        var offsetX = (i - count / 2) * 6 + (Math.random() * 4 - 2);
        burst.style.left = (rect.left + rect.width / 2 + offsetX) + 'px';
        burst.style.top = (rect.top + rect.height / 2) + 'px';
        burst.style.animationDelay = (i * 0.04) + 's';
        document.body.appendChild(burst);
        setTimeout((function(el) { return function() { if (el.parentNode) el.parentNode.removeChild(el); }; })(burst), 1100);
      }
    }

    // FIX рассинхрона авторизации: пользователь мог войти НА САЙТЕ через
    // Telegram-OIDC — тогда сервер знает его по tg_session cookie, а
    // localStorage этого домена может быть пуст (чистили кеш, другой профиль).
    // Раньше плеер в этом случае показывал «Войдите через Telegram», хотя
    // сайт говорил «вход выполнен». Теперь при guest-id спрашиваем /api/me:
    // сервер резолвит cookie и возвращает реальный telegram_id — сохраняем
    // его в localStorage и работаем как авторизованный пользователь.
    async function resolveSessionUser() {
      try {
        var res = await (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.apiFetch('/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ userId: getUserId(), initData: getTgInitData() })
        }) : fetch('/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ userId: getUserId(), initData: getTgInitData() })
        }));
        if (!res || !res.ok) return null;
        var data = await res.json();
        if (data && data.exists && data.user_id && String(data.user_id).indexOf('web_') !== 0) {
          try {
            localStorage.setItem('filmotiv_tg_user_id', String(data.user_id));
            if (data.username) localStorage.setItem('filmotiv_tg_username', String(data.username));
          } catch (_) {}
          console.log('[player] Session cookie resolved to user', data.user_id);
          return String(data.user_id);
        }
      } catch (_) {}
      return null;
    }

    async function loadFavoriteState() {
      var uid = getUserId();
      if (!uid || String(uid).indexOf('web_') === 0) {
        uid = await resolveSessionUser();
      }
      if (!uid || String(uid).indexOf('web_') === 0) return;
      try {
        var res = await (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.apiFetch('/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ userId: uid, initData: getTgInitData() })
        }) : fetch('/api/me', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ userId: uid, initData: getTgInitData() })
        }));
        if (!res || !res.ok) return;
        var data = await res.json();
        var favs = data.favorites || [];
        isFavorite = favs.some(function(f) { return String(f.filmId) === String(kid); });
        updateFavBtn();
        // Поздний премиум: если /api/me подтвердил премиум, а iframe грузился
        // без премиум-бриджа (не было кеша / медленный ответ) и пользователь
        // ещё не начал смотреть — тихо перезагружаем плеер уже без рекламы.
        try {

            console.log('[player] Late premium confirm → reloading player ad-free');

          }
        } catch (_) {}
      } catch (e) { console.warn('[fav] load state failed', e); }
    }

    async function toggleFavorite() {
      var uid = getUserId();
      if (!uid || String(uid).indexOf('web_') === 0) {
        // Сначала пробуем cookie-сессию сайта — возможно, вход уже выполнен
        uid = await resolveSessionUser();
        if (!uid) {
          showToast('Войдите через Telegram, чтобы сохранять коллекцию', 3000);
          return;
        }
      }
      var newType = isFavorite ? 'favorite_removed' : 'favorite_added';
      try {
        await (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.apiFetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            type: newType, initData: getTgInitData(), userId: uid,
            username: localStorage.getItem('filmotiv_tg_username') || '',
            filmId: kid, title: title
          }), keepalive: true
        }) : fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            type: newType, initData: getTgInitData(), userId: uid,
            username: localStorage.getItem('filmotiv_tg_username') || '',
            filmId: kid, title: title
          }), keepalive: true
        }));
        isFavorite = !isFavorite;
        updateFavBtn();
        if (isFavorite) {
          favBtn.classList.remove('pop'); void favBtn.offsetWidth; favBtn.classList.add('pop');
          showFavBurst();
          showToast('❤ Вы добавили фильм в избранное', 1800);
        } else {
          favBtn.classList.remove('unpop'); void favBtn.offsetWidth; favBtn.classList.add('unpop');
          showToast('Вы убрали фильм из избранного', 1500);
        }
        setTimeout(function() { favBtn.classList.remove('pop', 'unpop'); }, 600);
      } catch (e) {
        console.warn('[fav] toggle failed', e);
        showToast('Ошибка', 1500);
      }
    }

    if (favBtn) {
      favBtn.addEventListener('click', toggleFavorite);
    }
    loadFavoriteState();

    // Seek to saved position with retries. venoplayer may reset currentTime
    // to 0 after our seek (it calls play() which restarts from beginning).
    // We monitor currentTime after each seek and re-seek if it drops.
    var seekConfirmed = false;
    function attemptSeekToSaved() {
      if (!savedPos || !playerReady) return;
      if (seekConfirmed) return;
      var target = savedPos.t;
      // If we're already close to target (within 10s), seek succeeded
      if (lastKnownTime > 0 && Math.abs(lastKnownTime - target) < 10) {
        console.log('[player] Seek confirmed at', lastKnownTime, '(target:', target + ')');
        seekConfirmed = true;
        isResuming = false;
        return;
      }
      // If we've tried 8 times, give up (was 5 — venoplayer can be slow to load)
      if (seekRetries >= 8) {
        console.warn('[player] Seek failed after 8 retries, lastKnownTime:', lastKnownTime);
        isResuming = false;
        return;
      }
      seekRetries++;
      isResuming = true;
      console.log('[player] Seek attempt ' + seekRetries + ' to', target, '(currentTime:', lastKnownTime + ')');
      sendToPlayer({ type: 'seek', time: target });
      // Retry after 1.5s — bridge.js needs time for canplay + aggressive seek
      setTimeout(attemptSeekToSaved, 1500);
    }

    function maybeSavePosition(t) {
      if (!t || t < 5 || !isFinite(t)) return;
      var now = Date.now();
      // Save to localStorage every 3s
      if (now - lastSaveTime < 3000) return;
      lastSaveTime = now;
      savePosition(t, lastKnownDuration);
      // Send to backend every 10s (for cross-device resume)
      if (now - lastBackendSaveTime >= 10000) {
        lastBackendSaveTime = now;
        sendPositionToBackend(t, lastKnownDuration);
      }
    }

    window.addEventListener('message', function(e) {
      var data = e.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (_) { return; }
      }
      if (!data || typeof data !== 'object') return;

      if (data.type === 'bridge_ready') {
        console.log('[player] Bridge ready');
        __bridgeArrived = true; // сигнал успеха для edge-канала (poll)
        loadingOverlay.classList.add('hidden');
      }
      if (data.type === 'ready' || data.type === 'loaded') {
        playerReady = true;
        if (!playerReadyTime) playerReadyTime = Date.now();
        loadingOverlay.classList.add('hidden');
        if (typeof data.duration === 'number' && data.duration > 0) {
          lastKnownDuration = data.duration;
          __metaArrived = true;
        }
        // Start seek retry loop
        setTimeout(attemptSeekToSaved, 500);
      }
      if (data.type === 'timeupdate' || data.type === 'currentTime') {
        if (typeof data.currentTime === 'number') lastKnownTime = data.currentTime;
        if (typeof data.duration === 'number' && data.duration > 0) {
          lastKnownDuration = data.duration;
          __metaArrived = true;
        }
        maybeSavePosition(lastKnownTime);
      }
      if (data.type === 'seeked') {
        console.log('[player] Seeked event:', data.currentTime);
        if (typeof data.currentTime === 'number') lastKnownTime = data.currentTime;
        // If seeked position is close to target, mark as confirmed
        // to stop the retry loop in attemptSeekToSaved
        if (savedPos && typeof data.currentTime === 'number') {
          if (Math.abs(data.currentTime - savedPos.t) < 10) {
            seekConfirmed = true;
            isResuming = false;
            console.log('[player] Seek confirmed via seeked event');
          }
        }
      }
      if (data.type === 'ended') {
        // Ignore 'ended' events while resuming (venoplayer fires false ended
        // during seek when buffer underrun happens).
        if (isResuming) {
          console.log('[player] Ignored ended event during resume');
          return;
        }
        // Only show rate overlay if video ACTUALLY reached the end.
        // Strict checks to avoid false positives from venoplayer's
        // spurious 'ended' events during buffer underruns:
        //   1. duration must be known (> 60s — skip short videos/trailers)
        //   2. currentTime must be within last 5% of duration (not 30s —
        //      some films are 3h long, 30s is too generous)
        //   3. currentTime must be > 80% of duration (user watched most of it)
        //   4. video must have been playing for at least 60 seconds (not
        //      immediately after load)
        var videoAge = Date.now() - playerReadyTime;
        var isRealEnd = lastKnownDuration > 60 &&
                        lastKnownTime > lastKnownDuration * 0.95 &&
                        lastKnownTime > lastKnownDuration * 0.8 &&
                        videoAge > 60000;
        if (isRealEnd) {
          clearPosition();
          console.log('[player] Position cleared (video reached end at', lastKnownTime, '/', lastKnownDuration + ')');
          // Show the rate-film overlay — user finished watching.
          setTimeout(showRateOverlay, 800);
        } else {
          console.log('[player] Ignored ended event (currentTime:', lastKnownTime, 'duration:', lastKnownDuration, 'videoAge:', videoAge + 'ms)');
        }
      }
      if (data.type === 'pip_enter') console.log('[player] PiP active');
      if (data.type === 'pip_error') console.warn('PiP error:', data.message);
    });

    function saveBeforeLeave() {
      if (lastKnownTime > 5) {
        savePosition(lastKnownTime, lastKnownDuration);
        sendPositionToBackend(lastKnownTime, lastKnownDuration);
      }
    }
    window.addEventListener('pagehide', saveBeforeLeave);
    window.addEventListener('beforeunload', saveBeforeLeave);
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') saveBeforeLeave();
    });

    // ====== Загрузка плеера v187 — три канала + свой резервный плеер (порт решения Genopoisk v180) ======
    // Апстрим embess поменял пайплайн (x-en-x теперь отдаёт полные MPD вместо
    // компактных session-манифестов) — старая клиентская схема сломалась.
    // Рабочая схема проверена на проде Genopoisk (f090698, общий владелец):
    //   КАНАЛ 1 (ГЛАВНЫЙ, «оригинальный плеер») — Edge-прокси /api/embed-edge
    //     (runtime 'edge', egress из CDN PoP, НЕ из лямбда-AWS): api.embess.ws
    //     блокирует дата-центр IP (410), но пропускает PoP-IP (замер 7/7).
    //     IP клиента не участвует (не троттлится!), мост внедряется на
    //     сервере, медиа идёт через /api/media (AWS-egress — CDN режет
    //     PoP-IP на сегментах). iframe.src = edge-прокси, успех — по
    //     bridge_ready (до 7с). Реклама блокируется у премиума (бридж).
    //   КАНАЛ 2 (резерв) — клиентская серия по 6 зеркалам семейства
    //     (srcdoc + мост), паузы 1.2с между хостами против флага частоты.
    //   КАНАЛ 3 (резерв «на всякий случай») — FlixCDN прямым iframe
    //     (его API работает только со своим origin — srcdoc не воспроизводит
    //     видео; X-Frame-Options нет). Без моста: СВОЯ реклама, без resume.
    //     Доступен и кнопкой ⇄ в шапке (смена БЕЗ перезагрузки страницы).
    // Bridge.js tracks video.currentTime via postMessage and handles seek
    // for resume playback. venoplayer does NOT support ?t= URL parameter,
    // so we need bridge to call video.currentTime = X after metadata loads.
    // ПРЕМИУМ (v176): реклама возвращена обычным пользователям, у премиума —
    // без рекламы. Бридж грузится с &premium=1 только для премиума
    // (параметр проксируется и в edge-канал).
    var loadStartTime = performance.now();
    var __playStarted = false;   // видео уже началось — не перезагружаем iframe
    var __bridgePremium = false; // какой бридж сейчас в iframe
    var __bridgeArrived = false; // bridge_ready получен (srcdoc ИЛИ edge-iframe)
    var __metaArrived = false;   // метаданные видео получены (длительность > 0)
    // v192: __srcMode и резервный плеер удалены по запросу владельца («старый
    // заработал нормально») — осталась цепочка edge → семейство зеркал.
    (function() {
      window.addEventListener('message', function(e) {
        var d = e.data;
        if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
        if (!d || typeof d !== 'object') return;
        if (d.type === 'play' || (d.type === 'timeupdate' && d.currentTime > 0)) __playStarted = true;
        // v192: flix_ready/flix_error убраны вместе с резервным плеером
      });
    })();
    function premiumCached() {
      try { return localStorage.getItem('filmotiv_is_premium') === '1'; } catch (_) { return false; }
    }
    // ====== ПРОВАЙДЕРЫ ПЛЕЕРА (КАНАЛ 2 — клиентский резерв) ======
    // embess.ws — не единственный агрегатор: это СЕМЕЙСТВО зеркал с одним
    // форматом /embed/kp/{id} (atomics/marts/domem/namy — обнаружено в
    // kinoserver.py проекта reyohoho). 422-троттлинг ГУЛЯЕТ между хостами —
    // когда embess «горячий», atomics отвечает 200, и наоборот.
    // Серверная фаза v184 (_embed-fetch) и «две фазы v185» ушли: главный
    // канал теперь edge-прокси (Канал 1), семейство — клиентский резерв
    // (Канал 2), FlixCDN — последний рубеж (Канал 3).
    var PLAYER_PROVIDERS = [
      { label: 'embess',   fetch: 'https://api.embess.ws/embed/kp/',            base: 'https://api.embess.ws/' },
      { label: 'atomics0', fetch: 'https://api1690380040.atomics.ws/embed/kp/', base: 'https://api1690380040.atomics.ws/' },
      { label: 'marts',    fetch: 'https://api.marts.ws/embed/kp/',             base: 'https://api.marts.ws/' },
      { label: 'domem',    fetch: 'https://api.domem.ws/embed/kp/',             base: 'https://api.domem.ws/' },
      { label: 'namy',     fetch: 'https://api.namy.ws/embed/kp/',              base: 'https://api.namy.ws/' },
      { label: 'atomics',  fetch: 'https://api.atomics.ws/embed/kp/',           base: 'https://api.atomics.ws/' }
    ];
    var __providerStart = 0; // ротация старта — не бьём всегда в один и тот же

    function providerFetch(p) {
      var ctrl = new AbortController();
      var timer = setTimeout(function() { try { ctrl.abort(); } catch (_) {} }, 8000);
      return fetch(p.fetch + encodeURIComponent(kid), {
        headers: { 'Accept': 'text/html,application/xhtml+xml' },
        signal: ctrl.signal
      }).then(function(res) { clearTimeout(timer); return res; })
        .catch(function(e) { clearTimeout(timer); throw e; });
    }

    // Подтверждённый факт «фильм есть/нет» — в ОБЩИЙ кеш доступности
    // (v182), чтобы фильтр выдачи у всех пользователей не дёргал embess.
    function reportAvailable(ok) {
      try {
        var fact = {}; fact[kid] = !!ok;
        var init = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ results: fact }) };
        var req = window.FilmotivAPIOrigin
          ? window.FilmotivAPIOrigin.apiFetch('/api/kinopoisk?q=_embed-cache', init, 4000)
          : fetch('/api/kinopoisk?q=_embed-cache', init);
        if (req && req.catch) req.catch(function() {});
      } catch (_) {}
    }

    // Клиентская серия по семейству. onHtml(html, provider) — HTML для
    // srcdoc; onFail(allMissing) — всё исчерпано. 404 всего семейства =
    // «точно нет» (каталог общий). Пауза 1.2с между хостами: анти-бот
    // наказывает ЧАСТОТУ (рапид-файр углубляет флаг IP; замер Genopoisk:
    // серия 6×2с → 0/10 успехов), одиночные попытки проходят ~50%.
    function tryChain(onHtml, onFail) {
      var start = __providerStart++ % PLAYER_PROVIDERS.length;
      var missing = 0;
      var i = 0;
      (function next() {
        if (__playStarted) return;
        if (i >= PLAYER_PROVIDERS.length) {
          onFail(missing >= PLAYER_PROVIDERS.length);
          return;
        }
        var p = PLAYER_PROVIDERS[(start + i) % PLAYER_PROVIDERS.length];
        i++;
        console.log('[player] provider', p.label, '→', p.fetch + kid);
        providerFetch(p).then(function(res) {
          if (res.ok) return res.text();
          if (res.status === 404) missing++;
          throw new Error('HTTP ' + res.status);
        }).then(function(html) {
          onHtml(html, p);
        }).catch(function() { setTimeout(next, 1200); });
      })();
    }
    function buildPlayerHtml(html, baseHref) {
      // v192: путь к бриджу — с корнем текущей страницы ('' на vercel-корне,
      // '/fm' на зеркале) — относительность внутри srcdoc не работает из-за <base>.
      var __rootDir = (location.pathname.replace(/\/[^\/]*$/, '')) || '';
      var bridgeTag = '<script src="https://' + window.location.host + __rootDir + '/bridge.js?v=187' + (__bridgePremium ? '&premium=1' : '') + '"><\/script>';
      var baseTag = '<base href="' + (baseHref || 'https://api.embess.ws/') + '">';
      var referrerMeta = '<meta name="referrer" content="no-referrer">';
      if (/<head[^>]*>/i.test(html)) {
        html = html.replace(/<head[^>]*>/i, function(match) {
          return match + bridgeTag + referrerMeta + baseTag;
        });
      } else if (/<html[^>]*>/i.test(html)) {
        html = html.replace(/(<html[^>]*>)/i, '$1<head>' + bridgeTag + referrerMeta + baseTag + '</head>');
      } else {
        html = '<head>' + bridgeTag + referrerMeta + baseTag + '</head>' + html;
      }
      return html;
    }
    function onPlayerHtmlReady(html, p, quiet) {
      if (__playStarted) return;
      console.log('[player] OK via', p.label, 'size:', html.length, 'in', ((performance.now() - loadStartTime) / 1000).toFixed(2) + 's');
      iframe.removeAttribute('src');
      iframe.srcdoc = buildPlayerHtml(html, p.base);
      if (!quiet) { hidePlayerError(); loadingOverlay.classList.add('hidden'); }
      reportAvailable(true);
    }
    function setProgress(msg) {
      var el = document.getElementById('loadingSubtitle');
      if (el) el.textContent = msg;
    }

    // КАНАЛ 1 — edge-прокси: iframe.src = /api/embed-edge (мост внедряется
    // на сервере, IP клиента не участвует). Успех — по bridge_ready /
    // метаданным (poll 250мс, таймаут timeoutMs). Возврат true/false.
    function edgeEmbedUrl() {
      var p = '/api/embed-edge?id=' + encodeURIComponent(kid) + (__bridgePremium ? '&premium=1' : '');
      return (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.edgeUrl(p) : p);
    }
    function tryEdgeProxy(timeoutMs) {
      return new Promise(function(resolve) {
        if (__bridgeArrived || __metaArrived || __playStarted) return resolve(true);
        iframe.removeAttribute('srcdoc');
        iframe.src = edgeEmbedUrl();
        var t0 = Date.now();
        (function poll() {
          if (__bridgeArrived || __metaArrived || __playStarted) return resolve(true);
          if (Date.now() - t0 >= timeoutMs) return resolve(false);
          setTimeout(poll, 250);
        })();
      });
    }

    // Watchdog: если после успешного канала видео так и не стартовало за
    // 25с (манифест/CDN недоступны для этого клиента) — экран ошибки +
    // фоновые ретраи, вместо вечного чёрного экрана.
    function startVideoWatchdog() {
      setTimeout(function() {
        if (__playStarted) return;
        if (!__metaArrived && !__bridgeArrived) {
          console.warn('[player] watchdog: видео не отвечает за 25с → экран ошибки');
          showPlayerError('throttled');
          startBgRetry();
        }
      }, 25000);
    }

    // Полный обход каналов ОРИГИНАЛЬНОГО плеера: edge → семейство → FlixCDN.
    // onDone(source) — что-то загрузилось. gen замыкается на момент входа:
    // смена режима/перезапуск (loadPlayer) отменяет текущую цепочку.
    function runOriginalChain(onDone) {
      var gen = __bgRetry.gen;
      setProgress('Подключение к источнику…');
      tryEdgeProxy(7000).then(function(edgeOk) {
        if (gen !== __bgRetry.gen || __playStarted) return;
        if (edgeOk) {
          reportAvailable(true);
          onDone('edge-proxy');
          return;
        }
        console.warn('[player] edge-прокси не ответил за 7с — резервы');
        setProgress('Источник занят — пробуем зеркала…');
        tryChain(function(html, p) {
          if (gen !== __bgRetry.gen || __playStarted) return;
          onPlayerHtmlReady(html, p, false);
          onDone(p.label);
        }, function(allMissing) {
          if (gen !== __bgRetry.gen || __playStarted) return;
          if (allMissing) {
            console.warn('[player] все зеркала семейства дали 404 → фильма нет');
            showPlayerError('missing');
            return;
          }
          console.warn('[player] семейство исчерпано → экран ошибки + фоновые ретраи (v192: резервный плеер удалён)');
          showPlayerError('throttled');
          startBgRetry();
        });
      });
    }

    function loadPlayer(premium) {
      __bridgePremium = !!premium;
      __bridgeArrived = false;
      __metaArrived = false;
      console.log('[player] load start, premium =', !!premium);
      __bgRetry.gen++; // гасим возможный фоновый ретрай от прошлого запуска
      if (__bgRetry.timer) { clearInterval(__bgRetry.timer); __bgRetry.timer = null; }
      hidePlayerError();
      loadStartTime = performance.now();
      iframe.removeAttribute('src');
      iframe.removeAttribute('srcdoc');
      loadingOverlay.classList.remove('hidden');
      runOriginalChain(function(source) {
        console.log('[player] OK via', source, 'in', ((performance.now() - loadStartTime) / 1000).toFixed(2) + 's');
        loadingOverlay.classList.add('hidden');
        hidePlayerError();
        startVideoWatchdog();
      });
    }
    // Фоновые ретраи при неудаче — раз в 15с до 12 попыток (~3 мин). Каждый
    // тик снова обходит ВСЕ каналы (edge обычно оживает первым — серверный
    // egress не зависит от IP пользователя).
    var __bgRetry = { gen: 0, timer: null };
    function startBgRetry() {
      var gen = ++__bgRetry.gen;
      if (__bgRetry.timer) { clearInterval(__bgRetry.timer); __bgRetry.timer = null; }
      var tries = 0;
      var sub = document.getElementById('peSub');
      __bgRetry.timer = setInterval(function() {
        if (gen !== __bgRetry.gen || __playStarted) {
          clearInterval(__bgRetry.timer); __bgRetry.timer = null; return;
        }
        tries++;
        if (tries > 12) {
          clearInterval(__bgRetry.timer); __bgRetry.timer = null;
          if (sub) sub.textContent = 'Источник недоступен дольше обычного. Нажмите «Ещё раз» или попробуйте позже.';
          return;
        }
        if (sub) sub.textContent = 'Пробуем ещё раз автоматически (' + tries + '/12)…';
        runOriginalChain(function(source) {
          if (gen !== __bgRetry.gen || __playStarted) return;
          if (__bgRetry.timer) { clearInterval(__bgRetry.timer); __bgRetry.timer = null; }
          console.log('[player] Bg retry OK via', source, 'after', tries, 'tries');
          loadingOverlay.classList.add('hidden');
          hidePlayerError();
          startVideoWatchdog();
        });
      }, 15000);
    }
    function fetchPremium() {
      return new Promise(function(resolve) {
        var settled = false;
        function finish(v) { if (!settled) { settled = true; resolve(v); } }
        var timer = setTimeout(function() { finish(false); }, 1000);
        try {
          var prReq = (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.apiFetch('/api/me', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ userId: getUserId(), initData: getTgInitData() })
          }, 1500) : fetch('/api/me', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ userId: getUserId(), initData: getTgInitData() })
          }));
          prReq.then(function(r) { return (r && r.ok) ? r.json() : null; }).then(function(d) {
            clearTimeout(timer);
            var isPrem = !!(d && d.is_premium);
            try { if (isPrem) localStorage.setItem('filmotiv_is_premium', '1'); } catch (_) {}
            finish(isPrem);
          }).catch(function() { clearTimeout(timer); finish(false); });
        } catch (_) { clearTimeout(timer); finish(false); }
      });
    }
    // ВНИМАНИЕ (v183): здесь БЫЛА старая копия loadPlayer (v176) — из-за
    // function hoisting она перекрывала новый загрузчик с ретраями, и все
    // «плеер не работает» в v181/v182 шли именно из-за неё. Удалена.
    // Старт плеера: кешированный премиум — грузим сразу без ожидания,
    // иначе до 1с ждём подтверждения премиума (fail → реклама)
    if (premiumCached()) {
      loadPlayer(true);
    } else {
      fetchPremium().then(function(p) { loadPlayer(p); });
    }

    // Fix: after exiting fullscreen on mobile, venoplayer sometimes hides
    // its controls. We listen for fullscreenchange and send a 'showControls'
    // message to bridge, which will force the controls visible.
    function handleFullscreenChange() {
      var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      console.log('[player] Fullscreen change:', isFs ? 'entered' : 'exited');
      if (!isFs) {
        // Exited fullscreen — wait a bit then tell bridge to show controls
        setTimeout(function() {
          sendToPlayer({ type: 'showControls' });
        }, 300);
      }
    }
    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('mozfullscreenchange', handleFullscreenChange);

    // Safety timeout — if player hasn't loaded after 12s, show error
    // (HLS library might be blocked by ad blocker or upstream down)
    setTimeout(function() {
      if (!loadingOverlay.classList.contains('hidden')) {
        console.warn('[player] Safety timeout — player failed to load');
        loadingOverlay.classList.add('hidden');
        // Show error toast with helpful message
        if (toastEl) {
          toastEl.textContent = '⚠️ Плеер не загрузился. Возможно: ad-block блокирует скрипты, проблема с сетью, или источник недоступен. Попробуйте отключить ad-block или открыть другой фильм.';
          toastEl.classList.add('visible');
          setTimeout(function() { toastEl.classList.remove('visible'); }, 8000);
        }
      }
    }, 12000);

    iframe.addEventListener('load', function() {
      setTimeout(function() {
        if (!loadingOverlay.classList.contains('hidden')) {
          loadingOverlay.classList.add('hidden');
        }
      }, 1500);
    });

    // ====== Rate film overlay ======
    // Shows when the film ends. User can rate 1-5 stars or skip.
    // Rating is saved to Supabase via /api/track?type=rate (existing logic
    // in supabase.js rateFilm() which is also used by the bot). The bot's
    // 'Мои фильмы' list will show the rating as ⭐N next to the film.
    // Apply translations to rate overlay
    (function applyPlayerTranslations() {
      var rt = document.getElementById('rateTitle');
      if (rt && typeof t === 'function') rt.textContent = t('rateTitle');
      var rs = document.getElementById('rateSkip');
      if (rs && typeof t === 'function') rs.textContent = t('rateSkip');
    })();

    var rateOverlay = document.getElementById('rateOverlay');
    var rateFilmNameEl = document.getElementById('rateFilmName');
    var rateStarsEl = document.getElementById('rateStars');
    var rateSkipBtn = document.getElementById('rateSkip');
    var rateShown = false; // prevent double-showing if 'ended' fires twice

    function showRateOverlay() {
      if (rateShown || !rateOverlay) return;
      rateShown = true;
      // Don't show if user is a guest (web_* ID) — rating requires a real account
      var uid = getUserId();
      if (!uid || String(uid).indexOf('web_') === 0) {
        console.log('[rate] Skipped — guest user');
        return;
      }
      // Don't show if we don't have a film ID
      if (!kid) return;
      if (rateFilmNameEl) rateFilmNameEl.textContent = title;
      rateOverlay.classList.add('visible');
      console.log('[rate] Overlay shown for film', kid);
    }

    function hideRateOverlay() {
      if (!rateOverlay) return;
      rateOverlay.classList.remove('visible');
    }

    // Hover preview — highlight stars up to the one being hovered
    if (rateStarsEl) {
      var starButtons = rateStarsEl.querySelectorAll('.rate-star');
      starButtons.forEach(function(btn) {
        btn.addEventListener('mouseenter', function() {
          var r = parseInt(btn.getAttribute('data-rating'), 10);
          starButtons.forEach(function(s, i) {
            s.classList.toggle('hover-active', i < r);
          });
        });
        btn.addEventListener('mouseleave', function() {
          starButtons.forEach(function(s) { s.classList.remove('hover-active'); });
        });
        // Click — save rating
        btn.addEventListener('click', function() {
          var rating = parseInt(btn.getAttribute('data-rating'), 10);
          saveRating(rating);
        });
      });
    }

    // Touch support — on mobile, hover doesn't work. Tap once = preview,
    // tap again on same star = confirm. We simplify: tap = confirm directly.
    if (rateStarsEl) {
      rateStarsEl.querySelectorAll('.rate-star').forEach(function(btn) {
        btn.addEventListener('touchstart', function(e) {
          e.preventDefault();
          var rating = parseInt(btn.getAttribute('data-rating'), 10);
          // Visual feedback
          rateStarsEl.querySelectorAll('.rate-star').forEach(function(s, i) {
            s.classList.toggle('active', i < rating);
            s.textContent = i < rating ? '★' : '☆';
          });
          // Save after short delay (lets user see the visual)
          setTimeout(function() { saveRating(rating); }, 300);
        }, { passive: false });
      });
    }

    function saveRating(rating) {
      var uid = getUserId();
      if (!uid || String(uid).indexOf('web_') === 0) {
        hideRateOverlay();
        return;
      }
      // Send rating to backend via /api/track with type='rate'.
      // Backend (supabase.js recordEvent) updates watched_films[].rating
      // and rated_films[] array. The bot reads these fields to show ⭐N
      // next to films in 'Мои фильмы'.
      var payload = JSON.stringify({
        type: 'rate',
        initData: getTgInitData(),
        userId: uid,
        username: localStorage.getItem('filmotiv_tg_username') || '',
        filmId: kid,
        title: title,
        rating: rating
      });
      try {
        var rOpts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: payload, keepalive: true };
        (window.FilmotivAPIOrigin ? window.FilmotivAPIOrigin.apiFetch('/api/track', rOpts, 5000) : fetch('/api/track', rOpts)).then(function(res) {
          if (res) console.log('[rate] Saved rating', rating, 'for film', kid, '— HTTP', res.status);
        }).catch(function(e) {
          console.warn('[rate] Save failed:', e);
        });
      } catch (e) {
        console.warn('[rate] Save error:', e);
      }
      // Show confirmation
      var titleEl = document.getElementById('rateTitle');
      if (titleEl) titleEl.textContent = 'Спасибо за оценку! ⭐' + rating;
      if (rateStarsEl) rateStarsEl.style.display = 'none';
      if (rateSkipBtn) rateSkipBtn.textContent = 'Готово';
      // Auto-hide after 1.5s
      setTimeout(hideRateOverlay, 1500);
    }

    if (rateSkipBtn) {
      rateSkipBtn.addEventListener('click', hideRateOverlay);
    }

    // Resume happens silently — no toast. Position is shown on the main page
    // in the "Continue watching" card instead.

    // ====== Экран ошибки плеера (фильма нет / источник перегружен) ======
    function showPlayerError(kind) {
      var el = document.getElementById('playerError');
      if (!el) return;
      loadingOverlay.classList.add('hidden');
      var t = document.getElementById('peTitle');
      var s = document.getElementById('peSub');
      if (kind === 'missing') {
        if (t) t.textContent = 'Фильма нет в онлайн-плеере';
        if (s) s.textContent = 'Источник пока не добавил этот фильм. Откройте другой фильм или попробуйте позже.';
      } else {
        if (t) t.textContent = 'Плеер недоступен';
        if (s) s.textContent = 'Источник временно перегружен. Уже пробуем другие каналы автоматически — обычно проходит за пару минут.';
      }
      el.classList.add('visible');
    }
    function hidePlayerError() {
      var el = document.getElementById('playerError');
      if (el) el.classList.remove('visible');
    }
    var peRetry = document.getElementById('peRetry');
    if (peRetry) peRetry.addEventListener('click', function() { hidePlayerError(); loadingOverlay.classList.remove('hidden'); loadPlayer(__bridgePremium); });
    var peClose = document.getElementById('peClose');
    if (peClose) peClose.addEventListener('click', function() {
      try { window.location.replace('index.html'); } catch (_) { window.location.href = 'index.html'; }
    });
    // v192: прозрачная подсказка по центру плеера — после загрузки страницы,
    // pointer-events:none (клики проходят насквозь), плавно гаснет через 7с.
    var playHint = document.getElementById('playHint');
    if (playHint) {
      setTimeout(function() { playHint.classList.add('visible'); }, 1200);
      setTimeout(function() { playHint.classList.remove('visible'); }, 8200);
    }
  </script>
</body>
</html>
